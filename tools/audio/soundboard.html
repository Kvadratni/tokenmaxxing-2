<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tokenmaxxing 2: soundboard</title>
    <!--
      Dev only. Auditions every sound and the score through the REAL engine
      (src/audio), served by the Vite dev server:
        http://localhost:5185/tools/audio/soundboard.html
      The first click anywhere unlocks audio. Not part of the game build.
    -->
    <style>
      :root {
        --bg: #14171c;
        --panel: #1b1f26;
        --edge: #2a2f38;
        --text: #c9d1d9;
        --dim: #7d8794;
        --green: #4ade5a;
        --amber: #f2b33d;
        --red: #e0524a;
        --purple: #9b6bd6;
        --blue: #4aa3f0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      body { padding: 18px 22px 40px; max-width: 1180px; }
      header { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
      h1 { margin: 0; font-size: 15px; letter-spacing: 0.22em; color: var(--green); text-shadow: 0 0 8px rgba(74, 222, 90, 0.35); }
      h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: 0.24em; color: var(--dim); font-weight: 600; }
      #status { color: var(--amber); letter-spacing: 0.08em; }
      #status.on { color: var(--green); }
      section { background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; padding: 12px 14px; margin-bottom: 12px; }
      .row { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
      .row + .row { margin-top: 10px; }
      label { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); }
      label output { color: var(--text); min-width: 3.5em; }
      input[type='range'] { width: 170px; accent-color: var(--green); }
      button {
        font: inherit; color: var(--text); background: #222730; border: 1px solid var(--edge); border-left: 3px solid var(--c, var(--green));
        border-radius: 3px; padding: 6px 10px; cursor: pointer; letter-spacing: 0.04em;
      }
      button:hover { background: #2a303b; border-color: var(--c, var(--green)); }
      button:active { transform: translateY(1px); }
      button.on { background: var(--c, var(--green)); color: var(--bg); }
      button small { color: var(--dim); margin-left: 4px; }
      button.on small { color: var(--bg); }
      .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
      .group { border: 1px solid var(--edge); border-radius: 4px; padding: 10px; }
      .group h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.2em; color: var(--c, var(--green)); }
      .group .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
      .group .sliders { margin-top: 8px; }
      #readout { color: var(--dim); white-space: pre; font-size: 12px; margin-top: 8px; }
      #readout b { color: var(--text); font-weight: normal; }
      .hint { color: var(--dim); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>TOKENMAXXING 2 · SOUNDBOARD</h1>
      <span id="status" data-testid="status">click anywhere to unlock audio</span>
    </header>

    <section>
      <h2>MASTER</h2>
      <div class="row">
        <label>music <input id="musicVol" type="range" min="0" max="1" step="0.01" value="0.6" /><output id="musicVolOut">0.60</output></label>
        <label>sfx <input id="sfxVol" type="range" min="0" max="1" step="0.01" value="0.8" /><output id="sfxVolOut">0.80</output></label>
        <label><input id="hoverTicks" type="checkbox" /> hover ticks on buttons (like the game)</label>
      </div>
    </section>

    <section>
      <h2>MUSIC · THE HUMAN'S ROOM</h2>
      <div class="row" id="scenes"></div>
      <div class="row">
        <button id="play" style="--c: var(--green)">▶ play</button>
        <button id="stop" style="--c: var(--red)">■ stop</button>
        <label>tension <input id="tension" type="range" min="0" max="1" step="0.01" value="0" /><output id="tensionOut">0.00</output></label>
        <label>context fill <input id="fill" type="range" min="0" max="1" step="0.01" value="0.3" /><output id="fillOut">0.30</output></label>
      </div>
      <div id="readout" data-testid="readout">not playing</div>
      <div class="hint">tension adds hats and arpeggio and lifts the top end; context fill opens the pad (and the pressure drone joins above 0.80)</div>
    </section>

    <section>
      <h2>SFX</h2>
      <div class="groups" id="groups"></div>
    </section>

    <script type="module" src="./soundboard.ts"></script>
  </body>
</html>

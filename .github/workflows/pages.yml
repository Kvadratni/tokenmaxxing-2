name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deploy at a time; a newer push supersedes an older build rather
# than racing it, but an in-progress deploy is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate, in the order it fails fastest: types, then the unit suite.
      # A broken build must not reach Pages.
      - run: npm run typecheck
      - run: npm test
      # `base: './'` in vite.config.ts keeps asset URLs relative, which is what
      # a project page served from /<repo>/ needs.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

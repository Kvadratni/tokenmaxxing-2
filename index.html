<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14161a" />
    <title>Tokenmaxxing — ship slop before the deadline</title>
    <meta
      name="description"
      content="A roguelike idle clicker about producing Slop, hiring agents, and shipping before the deadline kills the run."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314161a'/%3E%3Crect x='2' y='4' width='12' height='7' fill='%234ec94e'/%3E%3Crect x='1' y='11' width='14' height='2' fill='%233c434e'/%3E%3C/svg%3E" />
    <style>
      /* Pre-paint shell so there is never a white flash before the CSS module loads. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #14161a;
        color: #d7dee8;
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #boot {
        color: #4ec94e;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
        animation: boot-blink 1s steps(2, end) infinite;
      }
      @keyframes boot-blink {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          animation: none;
        }
      }
      #noscript {
        max-width: 40ch;
        text-align: center;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="app" data-testid="app">
      <div id="boot">booting slop pipeline…</div>
    </div>
    <noscript>
      <div id="noscript">
        <p><strong>Tokenmaxxing</strong> needs JavaScript. It is a game made of clicking; there is no server.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
